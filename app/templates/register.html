
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | LIL_GUY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>
    <main class="container py-5">
        <div class="text-center mb-4">
            <h1>LIL_GUY</h1>
            <p>Create your account and meet your lil guy.</p>
        </div>

        <form id="registerForm" class="mx-auto" style="max-width: 400px;">

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    class="form-control"
                    required
                    minlength="3"
                    maxlength="50"
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    required
                    minlength="12"
                    maxlength="128"
                >
            </div>

            <p id="errorMessage" class="text-danger"></p>
            <p id="successMessage" class="text-success"></p>

            <button type="submit" class="btn btn-dark w-100">
                CREATE ACCOUNT
            </button>

            <p class="text-center mt-3">
                Already have an account?
                <a href="/login">Log in here</a>
            </p>

        </form>
    </main>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const errorMessage = document.getElementById("errorMessage");
            const successMessage = document.getElementById("successMessage");

            errorMessage.textContent = "";
            successMessage.textContent = "";

            try {
                const response = await fetch("/users/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successMessage.textContent = "Account created! Redirecting to login...";

                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 1500);
                } else {
                    errorMessage.textContent =
                        data.detail || "Unable to create account.";
                }

            } catch (error) {
                errorMessage.textContent = "Unable to connect to the server.";
            }
        });
    </script>
</body>
</html>
